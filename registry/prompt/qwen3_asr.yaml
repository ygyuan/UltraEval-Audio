# Qwen3-ASR (Alibaba Qwen/Qwen3-ASR-1.7B) prompt configurations.
#
# The Qwen3-ASR model wrapper (audio_evals/models/asr/qwen3_asr.py) only
# extracts the audio path from the prompt -- it does NOT use any text
# instruction from the template.  The transcription target language is
# controlled by the model's `language` argument (see
# registry/model/qwen3_asr.yaml) which is forwarded through the isolated
# subprocess to ``Qwen3ASRModel.transcribe(language=...)`` to constrain the
# output language.
#
# Therefore these prompts only need to wrap the audio entry.

qwen3-asr-zh:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'

qwen3-asr-en:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
