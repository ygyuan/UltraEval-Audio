# Step-Audio-2-mini Prompts
# Based on examples from Step-Audio-2-mini documentation and Step-Audio-R1.1 prompts

# ============================================================================
# Audio Understanding Tasks
# ============================================================================

step_audio_2_mini_mmau:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      - role: user
        contents:
          - type: text
            value: "{{question}}\nPlease choose the answer from the following options, do not provide any additional explanations or content: \n{% for choice in choices %}{{ 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[loop.index0] }}. {{ choice }}\n{% endfor %}"
          - type: audio
            value: "{{WavPath}}"

step_audio_2_mini_mmsu:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      - role: user
        contents:
          - type: text
            value: "{{question}}\nPlease choose the answer from the following options, do not provide any additional explanations or content: \n{% for choice in choices %}{{ 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[loop.index0] }}. {{ choice }}\n{% endfor %}"
          - type: audio
            value: "{{WavPath}}"

# ============================================================================
# Math Audio Question Answering
# ============================================================================

step_audio_2_mini_spoken_mqa:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      - role: user
        contents:
          - type: text
            value: "Solve the given math question step by step."
          - type: audio
            value: "{{WavPath}}"

step_audio_2_mini_big_bench_audio:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      - role: user
        contents:
          - type: audio
            value: "{{WavPath}}"
          - type: text
            value: '仅用 "valid" 或 "invalid"，"yes" 或 "no"，或者数字来直接回答上面的问题，不要添加任何其他描述。'

