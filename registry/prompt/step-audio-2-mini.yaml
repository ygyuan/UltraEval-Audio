# ============================================================================
# ASR (Automatic Speech Recognition) Tasks
# ============================================================================

# Chinese ASR - following official examples.py: system="请记录下你所听到的语音内容。"
step_audio_2_mini_asr_zh:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      - role: system
        contents:
          - type: text
            value: "请记录下你所听到的语音内容。"
      - role: user
        contents:
          - type: audio
            value: "{{WavPath}}"

# English ASR
step_audio_2_mini_asr_en:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      - role: system
        contents:
          - type: text
            value: "Please transcribe the speech content you hear."
      - role: user
        contents:
          - type: audio
            value: "{{WavPath}}"

# ============================================================================
# Speech Translation Tasks
# ============================================================================

# Speech to Chinese translation - following official examples.py: system="请仔细聆听这段语音，然后将其内容翻译成中文。"
step_audio_2_mini_s2tt_zh:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      - role: system
        contents:
          - type: text
            value: "请仔细聆听这段语音，然后将其内容翻译成中文。"
      - role: user
        contents:
          - type: audio
            value: "{{WavPath}}"

# Speech to English translation
step_audio_2_mini_s2tt_en:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      - role: system
        contents:
          - type: text
            value: "Please listen carefully to this audio and then translate its content into English."
      - role: user
        contents:
          - type: audio
            value: "{{WavPath}}"