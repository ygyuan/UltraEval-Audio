# Voxtral 4B TTS 2603 prompt templates (preset voices).
# Reference: https://huggingface.co/mistralai/Voxtral-4B-TTS-2603

# ---------------- Generic / multilingual ----------------
voxtral-casual-male:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      voice: "casual_male"

voxtral-casual-female:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      voice: "casual_female"

voxtral-neutral-male:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      voice: "neutral_male"

voxtral-neutral-female:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      voice: "neutral_female"

voxtral-cheerful-female:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      text: "{{text}}"
      voice: "cheerful_female"

