# GLM-4-Voice Prompt Templates
# Based on GLM-4-Voice instruction-following audio interaction style
# NOTE: text_prompt is used as the system prompt in ultraeval_adapter_server.py

glm4voice-asr-zh:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
      - type: text
        value: 'User will provide you with a speech instruction. Do it step by step. First, think about the instruction and respond in a interleaved manner, with 13 text token followed by 26 audio tokens. Please transcribe the speech content in Chinese and output only the transcription result.'

glm4voice-asr-en:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
      - type: text
        value: 'User will provide you with a speech instruction. Do it step by step. First, think about the instruction and respond in a interleaved manner, with 13 text token followed by 26 audio tokens. Please transcribe the English speech and output only the transcription.'

glm4voice-s2tt-zh2en:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
      - type: text
        value: 'User will provide you with a speech instruction. Do it step by step. First, think about the instruction and respond in a interleaved manner, with 13 text token followed by 26 audio tokens. Please listen to the Chinese speech and translate it into English text, output only the translation.'

glm4voice-s2tt-en2zh:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
      - type: text
        value: 'User will provide you with a speech instruction. Do it step by step. First, think about the instruction and respond in a interleaved manner, with 13 text token followed by 26 audio tokens. Please listen to the English speech and translate it into Chinese text, output only the translation.'

glm4voice-emotion:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
      - type: text
        value: 'User will provide you with a speech instruction. Do it step by step. First, think about the instruction and respond in a interleaved manner, with 13 text token followed by 26 audio tokens. Listen to the audio and identify the speaker emotion. The answer must be exactly one of [surprise, anger, neutral, joy, sadness, fear, disgust]. Output only the label.'
