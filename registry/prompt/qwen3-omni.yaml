# Qwen3-Omni Prompt Templates
# Based on Qwen3-Omni official evaluation settings

# ASR Tasks - Automatic Speech Recognition
qwen3-omni-asr-zh:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
      - type: text
        value: '请将这段中文语音转换为纯文本。'

