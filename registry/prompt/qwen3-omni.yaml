qwen3-omni-tts-en:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: text
        value: 'Repeat the following text once without adding any other words:\n\n\n {{text}}\n'


qwen3-omni-tts-zh:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: text
        value: '重复一遍这段文字不要加其他字:\n\n\n {{text}}\n'

qwen3-mmsu:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
      - role: user
        contents:
          - type: audio
            value: "{{WavPath}}"
          - type: text
            value: "Choose the most suitable answer from options A, B, C, and D to respond the question in next line, **you should only choose A or B or C or D.** Do not provide any additional explanations or content.\n\nQuestion: {{question}}\n\nA. {{choice_a}}\nB. {{choice_b}}\nC. {{ choice_c | default('None') }}\nD. {{ choice_d | default('None') }}"

# Speech Emotion Recognition
qwen3-omni-emotion:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
      - type: text
        value: 'Listen the audio and judge the emotion of the speaker, the answer must be one of [surprise,anger,neutral,joy,sadness,fear,disgust], answer without explain.'

qwen3-omni-ravdess-emotion:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
      - type: text
        value: 'Listen the audio and judge the emotion of the speaker, the answer must be one of [neutral,calm,happy,sad,angry,fearful,disgust,surprised], answer without explain.'

qwen3-omni-sentiment:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
      - type: text
        value: 'Listen the audio and judge the sentiment of the speaker, the answer must be one of [positive,negative,neutral], answer without explain.'

# Audio Scene Classification - moan (binary: normal / porn)
qwen3-omni-asc-moan:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
      - type: text
        value: 'listen the audio and judge whether it contains moaning sounds (sexual/pornographic content). The answer must be one of [normal, porn]. Answer porn if the audio contains moaning or sexually explicit sounds, otherwise answer normal. Answer without explain.'

# Audio Scene Classification - multi-class (speech / music / noise / porn / song)
qwen3-omni-asc-multi:
  class: audio_evals.prompt.base.Prompt
  args:
    template:
    - role: user
      contents:
      - type: audio
        value: '{{WavPath}}'
      - type: text
        value: "listen the audio and classify the dominant audio scene. The answer must be exactly one of [speech, music, noise, porn, song]. Use 'speech' for human speech (e.g. mandarin / spoken voice), 'music' for instrumental or background music, 'noise' for environmental noise or non-speech non-music sounds, 'porn' if the audio contains moaning or sexually explicit sounds, and 'song' for singing voice. Answer without explain."
