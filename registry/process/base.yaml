json_content:
  class: audio_evals.process.base.ContentExtract
  args: {}


# Strip bracketed structural / non-speech tags such as [Music] / [Lyric] /
# [Vocal] from ASR predictions (used together with VibeVoice-ASR).
asr_strip_tags:
  class: audio_evals.process.base.BracketedTagStrip
  args: {}


qwen_pretrain_asr_tractor_zh:
  class: audio_evals.process.qwen.QwenAudioASRExtract
  args:
    lang: zh

qwen_pretrain_asr_tractor:
  class: audio_evals.process.qwen.QwenAudioASRExtract
  args:
    lang: en

zh_text_normalizer:
  class: audio_evals.process.normalization.TextNormalization
  args:
    lang: zh

en_text_normalizer:
  class: audio_evals.process.normalization.TextNormalization
  args:
    lang: en

text_normalizer:
  class: audio_evals.process.normalization.TextNormalization
  args: {}

trivia_qa_normalizer:
  class: audio_evals.process.triviaqa.TriviaQaNormalizer
  args: {}