# Qwen3-ASR (Alibaba Qwen/Qwen3-ASR-1.7B) ASR model configurations.
# Reference:
#   https://github.com/Qwen/Qwen3-ASR
#   third_party/Qwen3-ASR/examples/example_qwen3_asr_transformers.py
#
# The actual model loading happens inside an isolated subprocess
# (audio_evals/lib/Qwen3-ASR/asr_main.py) so that the heavy /
# version-specific dependencies (transformers==4.57.6, torch==2.6.0,
# qwen-omni-utils, ...) do not pollute the main UltraEval-Audio environment.

# Generic Qwen3-ASR (auto language detection).
qwen3-asr:
  class: audio_evals.models.asr.qwen3_asr.Qwen3ASR
  args:
    path: Qwen/Qwen3-ASR-1.7B
    dtype: bfloat16
    device: cuda
    attn_implementation: auto
    max_inference_batch_size: 32
    max_new_tokens: 512
    env_path: envs/Qwen3-ASR
    requirements_path: audio_evals/lib/Qwen3-ASR/asr_requirements.txt

# Chinese-constrained variant (used by run_eval_qwen3_asr.sh stage 1/3).
qwen3-asr-zh:
  class: audio_evals.models.asr.qwen3_asr.Qwen3ASR
  args:
    path: Qwen/Qwen3-ASR-1.7B
    dtype: bfloat16
    device: cuda
    attn_implementation: auto
    max_inference_batch_size: 32
    max_new_tokens: 512
    language: zh
    env_path: envs/Qwen3-ASR
    requirements_path: audio_evals/lib/Qwen3-ASR/asr_requirements.txt

# English-constrained variant (used by run_eval_qwen3_asr.sh stage 2).
