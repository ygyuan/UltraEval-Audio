# Mega-ASR (zhifeixie team, built on Qwen3-ASR-1.7B) model configurations.
# Reference:
#   https://github.com/xzf-thu/Mega-ASR
#   third_party/Mega-ASR/infer.py
#   third_party/Mega-ASR/src/MegaASR/model/megaASR.py
#   init_model/zhifeixie/Mega-ASR/README.md
#
# The actual model loading happens inside an isolated subprocess
# (audio_evals/lib/Mega-ASR/asr_main.py) so that the heavy /
# version-specific dependencies (transformers==4.57.6, torch==2.6.0,
# qwen-asr, peft, ...) do not pollute the main UltraEval-Audio
# environment.

# Generic Mega-ASR (auto language detection).
mega-asr:
  class: audio_evals.models.asr.mega_asr.MegaASR
  args:
    ckpt_dir: zhifeixie/Mega-ASR
    routing_enabled: true
    quality_threshold: 0.5
    dtype: bfloat16
    device_map: cuda:0
    attn_implementation: auto
    max_inference_batch_size: 32
    max_new_tokens: 256
    keep_delta_on_gpu: true
    backend: transformers
    env_path: envs/Mega-ASR
    requirements_path: audio_evals/lib/Mega-ASR/asr_requirements.txt

# Chinese-constrained variant (used by run_eval_mega_asr.sh stage 1/3).
mega-asr-zh:
  class: audio_evals.models.asr.mega_asr.MegaASR
  args:
    ckpt_dir: zhifeixie/Mega-ASR
