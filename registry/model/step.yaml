# Step-Audio-2-mini model configuration
Step-Audio-2-mini:
  class: audio_evals.models.step_audio_2_mini.StepAudio2Mini
  args:
    env_path: envs/step-audio-2-mini
    requirements_path: audio_evals/lib/StepAudio/requirements.txt
    model_path: stepfun-ai/Step-Audio-2-mini  # HuggingFace model path
    start_port: 9999
    tensor_parallel_size: 4  # Reduced for mini version
    max_model_len: 16384
    max_num_seqs: 32
    gpu_memory_utilization: 0.85
    startup_timeout: 600
    extract_thinking: true
    speech: false
    sample_params:
      max_new_tokens: 2048

# Step-Audio-R1.1 transformers inference (recommended)
step-audio-r1.1:
  class: audio_evals.models.step_audio_r1_transformers.StepAudioR1Transformers
  args:
    model_path: stepfun-ai/Step-Audio-R1.1
    max_model_len: 16384
    extract_thinking: true
    speech: false
    sample_params:
      max_new_tokens: 2048

# Step-Audio-R1.1 vLLM server version (legacy)
step-audio-r1.1-vllm:
  class: audio_evals.models.step_audio_r1.StepAudioR1
  args:
    env_path: envs/step-audio-r1
    requirements_path: audio_evals/lib/StepAudio/requirements.txt
    model_path: stepfun-ai/Step-Audio-R1.1
    start_port: 9999
    tensor_parallel_size: 8
    extract_thinking: true
    sample_params:
      temperature: 0.7
      repetition_penalty: 1.0
      stop_token_ids:
        - 151665

# Step-Audio-R1 vLLM server version (legacy)
step-audio-r1-vllm:
  class: audio_evals.models.step_audio_r1.StepAudioR1
  args:
    env_path: envs/step-audio-r1
    requirements_path: audio_evals/lib/StepAudio/requirements.txt
    model_path: stepfun-ai/Step-Audio-R1
    start_port: 9999
    tensor_parallel_size: 8
    extract_thinking: true
    sample_params:
      temperature: 0.7
      repetition_penalty: 1.0
      stop_token_ids:
        - 151665
