# GLM-ASR (zai-org) ASR model configurations
# Reference:
#   https://github.com/zai-org/GLM-ASR
#   init_model/zai-org/GLM-ASR-Nano-2512/README.md

# Generic GLM-ASR-Nano-2512 (no language constraint).
glm-asr:
  class: audio_evals.models.asr.glm_asr.GLMASR
  args:
    path: init_model/zai-org/GLM-ASR-Nano-2512
    dtype: bfloat16
    device: cuda
    attn_implementation: auto
    max_new_tokens: 500
    env_path: envs/GLM-ASR
    requirements_path: audio_evals/lib/GLM_ASR/asr_requirements.txt

# Chinese-constrained variant (used by run_eval_glm_asr_nano.sh stage 1/3).
glm-asr-zh:
  class: audio_evals.models.asr.glm_asr.GLMASR
  args:
    path: init_model/zai-org/GLM-ASR-Nano-2512
    dtype: bfloat16
    device: cuda
    attn_implementation: auto
    max_new_tokens: 500
    language: zh
    env_path: envs/GLM-ASR
    requirements_path: audio_evals/lib/GLM_ASR/asr_requirements.txt

# English-constrained variant (used by run_eval_glm_asr_nano.sh stage 2).
glm-asr-en:
  class: audio_evals.models.asr.glm_asr.GLMASR
  args:
    path: init_model/zai-org/GLM-ASR-Nano-2512
    dtype: bfloat16
    device: cuda
    attn_implementation: auto
    max_new_tokens: 500
    language: en
    env_path: envs/GLM-ASR
    requirements_path: audio_evals/lib/GLM_ASR/asr_requirements.txt
